name: FDroid Release

on:
    push:
        tags:
            - '*'

jobs:
    build-release:
        name: Build & Publish Signed APK
        runs-on: ubuntu-24.04

        steps:
            # Checkout the repository
            -   name: Checkout
                uses: actions/checkout@v7

            # Match JDK used by F-Droid for reproducibility
            -   name: Set up JDK 17
                uses: actions/setup-java@v6
                with:
                    java-version: '17'
                    distribution: 'temurin'

            # F-Droid documents that apksigner from Build Tools >= 35 can
            # produce APKs that cannot be verified using apksigcopier.
            # Pin version 34.0.0 instead of using the runner's latest.
            # https://f-droid.org/en/docs/Reproducible_Builds/
            -   name: Install Android Build Tools
                shell: bash
                run: |
                    "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                        --install "build-tools;34.0.0"

            # Build APK without reusing cached build outputs
            -   name: Build APK
                run: |
                    ./gradlew clean assembleRelease \
                        --no-build-cache \
                        --no-configuration-cache

            # Read the version name used by the Android app
            -   name: Set version name
                shell: bash
                run: |
                    VERSION_NAME=$(sed -n 's/^version=//p' gradle.properties)
                    echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

            # Sign APK
            -   name: Sign APK
                uses: r0adkll/sign-android-release@v1
                id: sign_apk
                with:
                    releaseDirectory: app/build/outputs/apk/release
                    signingKeyBase64: ${{ secrets.SIGNING_KEY }}
                    alias: ${{ secrets.ALIAS }}
                    keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
                    keyPassword: ${{ secrets.KEY_PASSWORD }}
                env:
                    BUILD_TOOLS_VERSION: '34.0.0'

            # Build Changelog
            -   name: Build Changelog
                id: build_changelog
                uses: ardalanamini/auto-changelog@v5
                with:
                    mention-authors: false
                    semver: false

            # Create GitHub Release
            -   name: Create Release
                id: create_release
                uses: actions/create-release@v1
                with:
                    tag_name: ${{ github.ref_name }}
                    release_name: ${{ github.ref_name }}
                    body: ${{ steps.build_changelog.outputs.changelog }}
                env:
                    GITHUB_TOKEN: ${{ github.token }}

            # Upload APK
            -   name: Upload APK
                uses: actions/upload-release-asset@v1
                env:
                    GITHUB_TOKEN: ${{ github.token }}
                with:
                    upload_url: ${{ steps.create_release.outputs.upload_url }}
                    asset_path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
                    asset_name: ${{ env.VERSION_NAME }}.apk
                    asset_content_type: application/vnd.android.package-archive
